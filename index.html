<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniDict</title>

<!-- 胖胖字體 Baloo 2 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

<!-- iPad / iPhone 加入主畫面桌面圖示設定 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" sizes="152x152" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MiniDict">

<style>
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:#F8F4EC;color:#0F6F6B;
  font-family:"Baloo 2","Hiragino Maru Gothic ProN","PingFang TC","Microsoft JhengHei","Noto Sans TC",Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}

/* 圖案維持最新版 108px 與置中排版 */
.logo{display:block;margin:12px auto 6px;width:108px;height:auto}
h1{margin:0 auto 20px;text-align:center;font-size:2.8rem;font-weight:800;line-height:1.1;color:#0F6F6B}

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:1.25rem;padding:12px 20px;border:4px solid #FFFFFF;border-radius:999px;background:#FFFFFF;color:#0F6F6B}
button{font:inherit;cursor:pointer;color:#0F6F6B;border:0;-webkit-appearance:none}
.go{background:#3F42C8;color:#FFFFFF;border-radius:999px;padding:10px 22px;font-size:1.1rem;font-weight:800;flex:none}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px auto 0;background:#FFFFFF;border-radius:999px;padding:6px 12px;width:fit-content;max-width:100%}
.tbtn{border-radius:999px;background:#DADBF6;padding:5px 14px;font-size:.95rem;font-weight:800}
#status{color:#3F7F7B;font-size:.9rem}

#file{position:fixed;top:-1000px;left:-1000px;opacity:0}

.stage{margin-top:22px;min-height:260px}
.card{background:#FFFFFF;border-radius:32px;padding:22px 20px}
.emoji{font-size:4.5rem;line-height:1;text-align:center;display:block}
.pic{display:block;margin:0 auto;width:120px;height:120px;object-fit:contain}
.wordrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.word{font-size:2.6rem;font-weight:800;margin:0;word-break:break-word;text-align:center}
.say{background:#EE7650;border-radius:50%;width:52px;height:52px;font-size:1.5rem;flex:none}
.say.small{width:42px;height:42px;font-size:1.15rem}
.meta{font-family:Helvetica,Arial,sans-serif;text-align:center;margin-top:6px;color:#3F7F7B;font-size:1.15rem}
.pos{display:inline-block;background:#BFE2D3;border-radius:999px;padding:1px 12px;margin-left:8px;font-size:1rem;color:#0F6F6B}
.zh{text-align:center;font-size:2rem;font-weight:800;margin:14px 0 4px}
.ex{margin-top:16px;background:#F0D3CB;border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.ex p{margin:0}
.ex .en{font-size:1.2rem;font-weight:800}
.ex .cn{opacity:.8;margin-top:2px}
.msg{text-align:center;padding:26px 12px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.near{margin-top:24px;background:#FFFFFF;border-radius:28px;padding:14px 14px 18px}
.near h2{margin:0 0 10px;font-size:1.05rem;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border-radius:999px;padding:7px 14px;font-size:1.05rem;font-weight:800;background:#DADBF6}
.chip:nth-child(3n+1){background:#F0D3CB}.chip:nth-child(3n+2){background:#BFE2D3}.chip:nth-child(3n){background:#DADBF6}
.chip.now{background:#3F42C8;color:#FFFFFF}

/* Yahoo 延伸字典捷徑卡片樣式 */
.ext-dict-card{
  margin-top:16px;
  background:#FFFFFF;
  border-radius:28px;
  padding:14px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.ext-dict-box-vertical{
  margin-top:18px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.ext-dict-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:#6B2896;
  color:#FFFFFF !important;
  text-decoration:none;
  font-size:1.05rem;
  font-weight:800;
  padding:10px 24px;
  border-radius:999px;
  transition:opacity .2s;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}
.ext-dict-btn:active{
  opacity:0.8;
}
</style>
</head>
<body>
<main>
  <!-- 最新自訂向量圖示（維持原比例） -->
  <svg class="logo" viewBox="0 0 9785.9 9840.58" aria-hidden="true">
    <g>
      <path fill="#B9E1D0" d="M936.05 6065.68c-420.58,245.34 -794.42,23.38 -922.94,759.38 -128.51,736.01 724.33,560.77 969.66,560.77 245.34,0 619.18,-93.46 619.18,-93.46 0,0 917.8,2840.91 1705.67,2523.46 787.88,-317.45 642.55,-1051.45 572.45,-1191.64 -70.09,-140.19 -654.22,-1957.86 -654.22,-1957.86l560.77 -308.58c482.96,-265.77 248.45,-927.82 -210.28,-934.62 -647.84,-9.63 -1320.15,103.72 -1320.15,-782.74 0,-175.24 -93.46,-712.65 303.75,-981.35 397.21,-268.7 665.91,-198.61 759.37,-852.83 91.92,-643.49 -422.74,-1104.8 -1102.22,-953.79 -487.19,108.28 -1238.37,166.13 -1427.27,1533.56 -112.72,816.01 477.53,2486.44 146.22,2679.7z"/>
      <path fill="#413CCC" d="M4473.54 3688.39c33.73,305.82 702.42,622.79 955.56,451.28 309.72,-209.8 719.68,-1304.84 1179.27,-1215.55 326.13,130.59 -45.72,976.72 409.47,1143.61 195.18,71.59 884.47,227.79 1055.99,85.48 595.91,-494.54 151.52,-3174.91 -263.81,-3727.96 -313.73,-265.4 -550.1,-527.92 -1014.89,-384.81 -868.19,267.31 -2408.58,2859.3 -2321.59,3647.95z"/>
      <path fill="#E1B4A6" d="M8865.13 7125.74c241.46,-56.73 367.57,-226.62 450.3,-446.26 601.35,-1597.05 -2201.72,-2167.92 -3472.92,-603.08 -2568.19,3161.37 3785.65,4303.58 3937.47,2237.84 60.37,-821.54 -348.32,-956 -914.85,-1188.5z"/>
    </g>
  </svg>
  <h1>MiniDict</h1>
  
  <div class="search">
    <!-- 原生搜尋框自帶清除按鈕，不再疊加次級按鈕 -->
    <input id="q" type="search" placeholder="輸入英文單字，例如 apple" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button class="go" id="go">查詢</button>
  </div>

  <div class="tools">
    <button class="tbtn" id="imp" type="button">📂 匯入單字</button>
    <button class="tbtn" id="clear" type="button" style="display:none">🧹 清除匯入</button>
    <input id="file" type="file" accept=".csv,.json,.txt">
    <span id="status"></span>
  </div>
  
  <section class="stage" id="stage"></section>
  <section class="near" id="near" style="display:none">
    <h2>附近的單字</h2>
    <div class="chips" id="chips"></div>
  </section>
</main>

<!-- 外連獨立單字檔 -->
<script src="words.js"></script>

<script>
if (!Array.prototype.find) {
  Array.prototype.find = function(predicate) {
    for (var i = 0; i < this.length; i++) {
      if (predicate(this[i], i, this)) return this[i];
    }
    return undefined;
  };
}

if (typeof WORDS === 'undefined') {
  var WORDS = [];
}

function $(id){ return document.getElementById(id); }
var stage = $('stage'), q = $('q');
var IMG_BASE = 'img/';
var POS_ICON = {'n.':'📝','v.':'🏃','adj.':'✨','adv.':'🎈','prep.':'📍','pron.':'👤','conj.':'🔗','num.':'🔢'};
var STORE_KEY = 'kidsdict-imported-v1';

function toEntry(r){
  var s = function(i){ return String(r[i] == null ? '' : r[i]).trim(); };
  return {w:s(0), ph:s(1), pos:s(2), zh:s(3), ex:s(4), exzh:s(5), em:s(6) || POS_ICON[s(2).split('/')[0]] || '📝', img:s(7)};
}

var DB = [];
var imported = [];
try {
  imported = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  if (!Array.isArray(imported)) imported = [];
} catch(e) {
  imported = [];
}

function rebuild(){
  var dict = {};
  var all = WORDS.concat(imported);
  DB = [];
  for (var i = 0; i < all.length; i++) {
    var e = toEntry(all[i]);
    if (e.w && !dict[e.w.toLowerCase()]) {
      dict[e.w.toLowerCase()] = true;
      DB.push(e);
    }
  }
  $('near').style.display = 'none';
  $('clear').style.display = imported.length ? 'inline-block' : 'none';
  $('status').textContent = imported.length ? ('共 ' + DB.length + ' 個單字（匯入 ' + imported.length + ' 個）') : ('共 ' + DB.length + ' 個單字');
}

function parseCSV(t){
  t = t.replace(/^\uFEFF/, '');
  var rows = []; var row = [], cur = '', inQuote = false;
  for(var i = 0; i < t.length; i++){
    var ch = t[i];
    if(inQuote){
      if(ch === '"'){
        if(t[i+1] === '"'){ cur += '"'; i++; } else inQuote = false;
      } else cur += ch;
    } else if(ch === '"'){
      inQuote = true;
    } else if(ch === ','){
      row.push(cur); cur = '';
    } else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && t[i+1] === '\n') i++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    } else {
      cur += ch;
    }
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function esc(t){
  return String(t).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function pic(d){
  var emo = '<span class="emoji" aria-hidden="true"' + (d.img ? ' style="display:none"' : '') + '>' + esc(d.em) + '</span>';
  if(!d.img) return emo;
  var src = /^(data:|https?:|\/)/.test(d.img) ? d.img : (IMG_BASE + d.img);
  return '<img class="pic" src="' + esc(src) + '" alt="" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'block\'">' + emo;
}

function speak(text){
  try {
    var s = window.speechSynthesis;
    if(!s) return;
    s.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.8;
    s.speak(u);
  } catch(e) {}
}

/* 查到單字時：例句卡片下方獨立帶有 Yahoo 字典捷徑按鈕 */
function showWord(d){
  q.value = d.w;
  var encodedWord = encodeURIComponent(d.w);
  var yahooUrl = 'https://tw.dictionary.search.yahoo.com/search?p=' + encodedWord;

  stage.innerHTML = 
    '<article class="card">' +
      pic(d) +
      '<div class="wordrow"><h3 class="word">' + esc(d.w) + '</h3>' +
        '<button class="say" id="sayw" aria-label="聽發音">🔊</button></div>' +
      '<div class="meta">' + esc(d.ph) + '<span class="pos">' + esc(d.pos) + '</span></div>' +
      '<div class="zh">' + esc(d.zh) + '</div>' +
      '<div class="ex"><button class="say small" id="saye" aria-label="聽例句">🔊</button>' +
        '<div><p class="en">' + esc(d.ex) + '</p><p class="cn">' + esc(d.exzh) + '</p></div></div>' +
    '</article>' +
    '<div class="ext-dict-card">' +
      '<a class="ext-dict-btn" href="' + yahooUrl + '" target="_blank" rel="noopener noreferrer">' +
        '🔍 Yahoo 字典' +
      '</a>' +
    '</div>';

  $('sayw').onclick = function(){ speak(d.w); };
  $('saye').onclick = function(){ speak(d.ex); };
  renderNear(d);
  speak(d.w);
}

function renderNear(d){
  var idx = -1;
  for(var i = 0; i < DB.length; i++){ if(DB[i] === d){ idx = i; break; } }
  if(idx < 0) return;
  var box = $('chips'); box.innerHTML = '';
  var start = Math.max(0, idx - 10);
  var end = Math.min(DB.length, idx + 11);
  for(var j = start; j < end; j++){
    var item = DB[j];
    var b = chip(item);
    if(item === d) b.className += ' now';
    box.appendChild(b);
  }
  $('near').style.display = 'block';
}

function showMsg(emoji, text, list){
  $('near').style.display = 'none';
  var sugHtml = (list && list.length) ? '<div class="sugs"></div>' : '';
  stage.innerHTML = '<div class="card msg"><span class="emoji">' + emoji + '</span><p>' + text + '</p>' + sugHtml + '</div>';
  if(list && list.length){
    var box = stage.querySelector('.sugs');
    for(var i = 0; i < list.length; i++) box.appendChild(chip(list[i]));
  }
}

/* 查無收錄時：跳出放大鏡詢問卡片，提供 Yahoo 字典捷徑按鈕 */
function showNotFound(word){
  $('near').style.display = 'none';
  var encodedWord = encodeURIComponent(word);
  var yahooUrl = 'https://tw.dictionary.search.yahoo.com/search?p=' + encodedWord;

  stage.innerHTML = 
    '<article class="card msg">' +
      '<span class="emoji">🔍</span>' +
      '<h3 style="margin:10px 0 6px; font-size:1.4rem; color:#0F6F6B;">這個字尚未收錄</h3>' +
      '<p style="margin:0 0 14px; opacity:0.85; font-size:1.1rem;">是否連接網路字典查詢「<b>' + esc(word) + '</b>」？</p>' +
      '<div class="ext-dict-box-vertical">' +
        '<a class="ext-dict-btn" href="' + yahooUrl + '" target="_blank" rel="noopener noreferrer">' +
          '🔍 Yahoo 字典' +
        '</a>' +
      '</div>' +
    '</article>';
}

function chip(d){
  var b = document.createElement('button');
  b.className = 'chip';
  b.textContent = d.w;
  b.onclick = function(){ showWord(d); };
  return b;
}

function search(){
  var t = q.value.trim().toLowerCase();
  if(!t){ showMsg('🔍','先輸入一個英文單字吧！'); return; }
  var hit = DB.find(function(d){ return d.w === t; });
  if(hit){ showWord(hit); return; }
  
  var near = [];
  for(var i = 0; i < DB.length; i++){
    if(DB[i].w.indexOf(t) === 0 || DB[i].zh.indexOf(t) !== -1){
      near.push(DB[i]);
      if(near.length >= 8) break;
    }
  }
  if(near.length === 1){ showWord(near[0]); return; }
  if(near.length){ showMsg('🤔','你是想找這些字嗎？', near); return; }
  
  showNotFound(t);
}

/* 點選原生 ✖ 清除輸入框時自動重設首頁 */
q.addEventListener('search', function(){
  if(!q.value){
    showMsg('🐣','你好！輸入英文單字，我來告訴你意思和怎麼唸。');
  }
});

$('go').onclick = search;
q.addEventListener('keydown', function(e){ if(e.keyCode === 13 || e.key === 'Enter') search(); });

$('imp').onclick = function(){
  $('file').click();
};

$('file').addEventListener('change', function(e){
  var f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(evt){
    try {
      var text = evt.target.result;
      var rows = parseCSV(text);
      var validRows = [];
      for(var i = 0; i < rows.length; i++){
        var r = rows[i];
        if(r[0] && !/^(單字|word)$/i.test(r[0].trim())){
          validRows.push(r);
        }
      }
      if(!validRows.length){ showMsg('😵','檔案裡沒有找到單字，請確認格式。'); return; }
      imported = validRows.slice(0, 5000);
      try { localStorage.setItem(STORE_KEY, JSON.stringify(imported)); } catch(err){}
      rebuild();
      showMsg('🎉', '匯入完成，共 ' + imported.length + ' 個單字！');
    } catch(err) {
      showMsg('😵','讀取失敗，請確認檔案格式。');
    }
  };
  reader.readAsText(f);
});

$('clear').onclick = function(){
  imported = [];
  try{ localStorage.removeItem(STORE_KEY); }catch(err){}
  rebuild();
  showMsg('🧹','已清除匯入的單字，回到內建單字。');
};

rebuild();
showMsg('🐣','你好！輸入英文單字，我來告訴你意思和怎麼唸。');
</script>
</body>
</html>
