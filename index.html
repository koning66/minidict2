<style>
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:#F8F4EC;color:#0F6F6B;
  font-family:"Baloo 2","Hiragino Maru Gothic ProN","PingFang TC","Microsoft JhengHei","Noto Sans TC",Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.logo{display:block;margin:4px auto 0;width:112px;height:auto}
h1{margin:0 auto 20px;text-align:center;font-size:2.8rem;font-weight:800;line-height:1.1;color:#0F6F6B}

.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:1.25rem;padding:12px 20px;border:4px solid #FFFFFF;border-radius:999px;background:#FFFFFF;color:#0F6F6B}
button{font:inherit;cursor:pointer;color:#0F6F6B;border:0;-webkit-appearance:none}
.go{background:#3F42C8;color:#FFFFFF;border-radius:999px;padding:10px 22px;font-size:1.1rem;font-weight:800;flex:none}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px auto 0;background:#FFFFFF;border-radius:999px;padding:6px 12px;width:fit-content;max-width:100%}
.tbtn{border-radius:999px;background:#DADBF6;padding:5px 14px;font-size:.95rem;font-weight:800}
#status{color:#3F7F7B;font-size:.9rem}
.stage{margin-top:22px;min-height:260px}
.card{background:#FFFFFF;border-radius:32px;padding:22px 20px}
.emoji{font-size:4.5rem;line-height:1;text-align:center;display:block}
.pic{display:block;margin:0 auto;width:120px;height:120px;object-fit:contain}
.wordrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.word{font-size:2.6rem;font-weight:800;margin:0;word-break:break-word;text-align:center}
.say{background:#EE7650;border-radius:50%;width:52px;height:52px;font-size:1.5rem;flex:none}
.say.small{width:42px;height:42px;font-size:1.15rem}
.meta{font-family:Helvetica,Arial,sans-serif;text-align:center;margin-top:6px;color:#3F7F7B;font-size:1.15rem}
.pos{display:inline-block;background:#BFE2D3;border-radius:999px;padding:1px 12px;margin-left:8px;font-size:1rem;color:#0F6F6B}
.zh{text-align:center;font-size:2rem;font-weight:800;margin:14px 0 4px}
.ex{margin-top:16px;background:#F0D3CB;border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.ex p{margin:0}
.ex .en{font-size:1.2rem;font-weight:800}
.ex .cn{opacity:.8;margin-top:2px}
.msg{text-align:center;padding:26px 12px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.near{margin-top:24px;background:#FFFFFF;border-radius:28px;padding:14px 14px 18px}
.near h2{margin:0 0 10px;font-size:1.05rem;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border-radius:999px;padding:7px 14px;font-size:1.05rem;font-weight:800;background:#DADBF6}
.chip:nth-child(3n+1){background:#F0D3CB}.chip:nth-child(3n+2){background:#BFE2D3}.chip:nth-child(3n){background:#DADBF6}
.chip.now{background:#3F42C8;color:#FFFFFF}
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 120 94" aria-hidden="true"><path d="M18 64A40 40 0 0 1 92 42" fill="none" stroke="#3F42C8" stroke-width="9" stroke-linecap="round"/><rect x="38" y="34" width="32" height="34" rx="14" fill="#E3B3A8" transform="rotate(-18 54 51)"/><circle cx="90" cy="64" r="8" fill="#EE7650"/><rect x="30" y="77" width="62" height="9" rx="4.5" fill="#BFE2D3"/></svg>
  <h1>MiniDict</h1>
  
  <div class="search">
    <input id="q" type="search" placeholder="輸入英文單字，例如 apple" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button class="go" id="go">查詢</button>
  </div>

  <div class="tools">
    <button class="tbtn" id="imp" type="button">📂 匯入單字</button>
    <button class="tbtn" id="clear" type="button" style="display:none">🧹 清除匯入</button>
    <input id="file" type="file" accept=".csv,.json,.txt" style="display:none">
    <span id="status"></span>
  </div>
  
  <section class="stage" id="stage"></section>
  <section class="near" id="near" style="display:none">
    <h2>附近的單字</h2>
    <div class="chips" id="chips"></div>
  </section>
</main>

<script>
if (!Array.prototype.find) {
  Array.prototype.find = function(predicate) {
    for (var i = 0; i < this.length; i++) {
      if (predicate(this[i], i, this)) return this[i];
    }
    return undefined;
  };
}
