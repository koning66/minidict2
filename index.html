<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniDict</title>

<!-- 胖胖字體 Baloo 2 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">

<!-- iPad / iPhone 加入主畫面桌面圖示設定 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" sizes="152x152" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="MiniDict">

<!-- 新舊設備分流判斷腳本：老舊 iOS 不開啟全螢幕以保留上一頁鍵，新設備與手機維持獨立 App -->
<script>
(function() {
  var ua = navigator.userAgent;
  // 檢測是否為老舊 iOS (iOS 9 ~ 10)
  var isOldIOS = /iPad|iPhone|iPod/.test(ua) && /OS [1-9]_\d|OS 10_\d/.test(ua);
  if (!isOldIOS) {
    var metaCapable = document.createElement('meta');
    metaCapable.name = 'apple-mobile-web-app-capable';
    metaCapable.content = 'yes';
    document.getElementsByTagName('head')[0].appendChild(metaCapable);

    var metaStatus = document.createElement('meta');
    metaStatus.name = 'apple-mobile-web-app-status-bar-style';
    metaStatus.content = 'default';
    document.getElementsByTagName('head')[0].appendChild(metaStatus);
  }
})();
</script>

<style>
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:#F8F4EC;color:#0F6F6B;
  font-family:"Baloo 2","Hiragino Maru Gothic ProN","PingFang TC","Microsoft JhengHei","Noto Sans TC",Helvetica,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}

/* 圖一：Logo 圖示與標題文字水平並排且整體置中 */
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 10px auto 20px;
}
.brand .logo {
  display: block;
  width: 58px;
  height: auto;
  flex-shrink: 0;
}
.brand h1 {
  margin: 0;
  text-align: center;
  font-size: 2.8rem;
  font-weight: 800;
  line-height: 1;
  color: #0F6F6B;
}

/* 搜尋框與唯一清除按鈕排版 */
.search{display:flex;gap:8px;align-items:center}
.input-box{position:relative;flex:1;display:flex;align-items:center}
.search input{width:100%;min-width:0;font:inherit;font-size:1.05rem;padding:12px 46px 12px 20px;border:4px solid #FFFFFF;border-radius:999px;background:#FFFFFF;color:#0F6F6B;outline:none;-webkit-appearance:none}

/* 徹底隱藏瀏覽器原生取消鍵，保證不出現雙重叉叉 */
input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-decoration{
  -webkit-appearance:none;
  display:none;
}

/* 專屬自訂清除按鈕 */
.clear-btn{
  position:absolute;
  right:12px;
  top:50%;
  margin-top:-14px;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#DADBF6;
  color:#3F42C8;
  font-size:14px;
  font-weight:bold;
  line-height:28px;
  text-align:center;
  padding:0;
  cursor:pointer;
  display:none;
}
.clear-btn:active{
  transform:scale(0.9);
}

button{font:inherit;cursor:pointer;color:#0F6F6B;border:0;-webkit-appearance:none}
.go{background:#3F42C8;color:#FFFFFF;border-radius:999px;padding:10px 22px;font-size:1.1rem;font-weight:800;flex:none}

/* 移至最底部的工具列樣式微調 */
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:28px auto 0;background:#FFFFFF;border-radius:999px;padding:6px 12px;width:fit-content;max-width:100%}
.tbtn{border-radius:999px;background:#DADBF6;padding:5px 14px;font-size:.95rem;font-weight:800}
#status{color:#3F7F7B;font-size:.9rem}

#file{position:fixed;top:-1000px;left:-1000px;opacity:0}

.stage{margin-top:22px;min-height:260px}
.card{background:#FFFFFF;border-radius:32px;padding:22px 20px}
.emoji{font-size:4.5rem;line-height:1;text-align:center;display:block}
.pic{display:block;margin:0 auto;width:120px;height:120px;object-fit:contain}
.wordrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.word{font-size:2.6rem;font-weight:800;margin:0;word-break:break-word;text-align:center}
.say{background:#EE7650;border-radius:50%;width:52px;height:52px;font-size:1.5rem;flex:none}
.say.small{width:42px;height:42px;font-size:1.15rem}
.meta{font-family:Helvetica,Arial,sans-serif;text-align:center;margin-top:6px;color:#3F7F7B;font-size:1.15rem}
.pos{display:inline-block;background:#BFE2D3;border-radius:999px;padding:1px 12px;margin-left:8px;font-size:1rem;color:#0F6F6B}
.zh{text-align:center;font-size:2rem;font-weight:800;margin:14px 0 4px}
.ex{margin-top:16px;background:#F0D3CB;border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.ex p{margin:0}
.ex .en{font-size:1.2rem;font-weight:800}
.ex .cn{opacity:.8;margin-top:2px}
.msg{text-align:center;padding:26px 12px}
.msg p {
  font-size: 1.35rem;
}
.sugs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.near{margin-top:24px;background:#FFFFFF;border-radius:28px;padding:14px 14px 18px}
.near h2{margin:0 0 10px;font-size:1.05rem;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border-radius:999px;padding:7px 14px;font-size:1.05rem;font-weight:800;background:#DADBF6}
.chip:nth-child(3n+1){background:#F0D3CB}.chip:nth-child(3n+2){background:#BFE2D3}.chip:nth-child(3n){background:#DADBF6}
.chip.now{background:#3F42C8;color:#FFFFFF}

/* Yahoo 延伸字典捷徑卡片樣式 */
.ext-dict-card{
  margin-top:16px;
  background:#FFFFFF;
  border-radius:28px;
  padding:14px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.ext-dict-box-vertical{
  margin-top:18px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.ext-dict-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:#6B2896;
  color:#FFFFFF !important;
  text-decoration:none;
  font-size:1.05rem;
  font-weight:800;
  padding:10px 26px;
  border-radius:999px;
  transition:opacity .2s;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}
.ext-dict-btn:active{
  opacity:0.8;
}
</style>
</head>
<body>
<main>
  <!-- 水平並排且居中對齊的品牌區塊 -->
  <header class="brand">
    <svg class="logo" viewBox="0 0 332.77 307.15" aria-hidden="true">
      <g>
        <path fill="#B9E1D0" d="M265.49 144.21c17.64,-4.14 26.86,-16.56 32.9,-32.61 43.94,-116.7 -160.88,-158.41 -253.77,-44.07 -187.66,231.01 276.63,314.47 287.72,163.52 4.41,-60.03 -25.45,-69.86 -66.85,-86.85z"/>
        <path fill="#3C6D6B" d="M103.22 155.53c-12.16,-4.06 -20.59,3.67 -27.86,-14.6 -7.27,-18.27 15.65,-18.34 21.97,-19.66 6.32,-1.32 16.46,-0.92 16.46,-0.92 0,0 8.36,-78.13 30.37,-74.19 22.01,3.94 22.21,23.63 21.16,27.62 -1.05,3.99 -6.32,53.96 -6.32,53.96l16.11 4.93c13.87,4.25 11.39,22.57 -0.39,25.21 -16.64,3.73 -34.57,4.43 -29.8,27.27 0.94,4.52 1.43,18.86 13.11,23.65 11.68,4.79 18.23,1.53 24.15,17.89 5.83,16.08 -4.95,30.74 -23.27,30.5 -13.13,-0.17 -32.8,2.38 -45.02,-31.83 -7.29,-20.42 -1.07,-66.63 -10.65,-69.83z"/>
      </g>
    </svg>
    <h1>MiniDict</h1>
  </header>
  
  <div class="search">
    <div class="input-box">
      <!-- 關閉自動校正與鍵盤自動選字 -->
      <input id="q" type="search" placeholder="想查什麼單字？" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
      <button class="clear-btn" id="bclear" type="button" aria-label="清除輸入">✕</button>
    </div>
    <button class="go" id="go">查詢</button>
  </div>
  
  <section class="stage" id="stage"></section>
  <section class="near" id="near" style="display:none">
    <h2>附近的單字</h2>
    <div class="chips" id="chips"></div>
  </section>

  <!-- 移至畫面最下方的匯入工具列（平時與查詢後皆在最底端） -->
  <div class="tools">
    <button class="tbtn" id="imp" type="button">📂 匯入單字</button>
    <button class="tbtn" id="clear" type="button" style="display:none">🧹 清除匯入</button>
    <input id="file" type="file" accept=".csv,.json,.txt">
    <span id="status"></span>
  </div>
</main>

<!-- 外連獨立單字檔 -->
<script src="words.js"></script>

<script>
if (!Array.prototype.find) {
  Array.prototype.find = function(predicate) {
    for (var i = 0; i < this.length; i++) {
      if (predicate(this[i], i, this)) return this[i];
    }
    return undefined;
  };
}

if (typeof WORDS === 'undefined') {
  var WORDS = [];
}

function $(id){ return document.getElementById(id); }
var stage = $('stage'), q = $('q'), bclear = $('bclear');
var IMG_BASE = 'img/';
var POS_ICON = {'n.':'📝','v.':'🏃','adj.':'✨','adv.':'🎈','prep.':'📍','pron.':'👤','conj.':'🔗','num.':'🔢'};
var STORE_KEY = 'kidsdict-imported-v1';

/* 克服 iPad 桌面 App (WebClip) 無法另開分頁的轉址函式 */
function openExt(e, url){
  var isStandalone = (window.navigator && window.navigator.standalone) || 
                     (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (isStandalone) {
    if (e && e.preventDefault) e.preventDefault();
    window.location.href = url;
    return false;
  }
  return true;
}

function toEntry(r){
  var s = function(i){ return String(r[i] == null ? '' : r[i]).trim(); };
  return {w:s(0), ph:s(1), pos:s(2), zh:s(3), ex:s(4), exzh:s(5), em:s(6) || POS_ICON[s(2).split('/')[0]] || '📝', img:s(7)};
}

var DB = [];
var imported = [];
try {
  imported = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  if (!Array.isArray(imported)) imported = [];
} catch(e) {
  imported = [];
}

function rebuild(){
  var dict = {};
  var all = WORDS.concat(imported);
  DB = [];
  for (var i = 0; i < all.length; i++) {
    var e = toEntry(all[i]);
    if (e.w && !dict[e.w.toLowerCase()]) {
      dict[e.w.toLowerCase()] = true;
      DB.push(e);
    }
  }
  $('near').style.display = 'none';
  $('clear').style.display = imported.length ? 'inline-block' : 'none';
  $('status').textContent = imported.length ? ('共 ' + DB.length + ' 個單字（匯入 ' + imported.length + ' 個）') : ('共 ' + DB.length + ' 個單字');
  updateClearBtn();
}

function parseCSV(t){
  t = t.replace(/^\uFEFF/, '');
  var rows = []; var row = [], cur = '', inQuote = false;
  for(var i = 0; i < t.length; i++){
    var ch = t[i];
    if(inQuote){
      if(ch === '"'){
        if(t[i+1] === '"'){ cur += '"'; i++; } else inQuote = false;
      } else cur += ch;
    } else if(ch === '"'){
      inQuote = true;
    } else if(ch === ','){
      row.push(cur); cur = '';
    } else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && t[i+1] === '\n') i++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    } else {
      cur += ch;
    }
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function esc(t){
  return String(t).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function pic(d){
  var emo = '<span class="emoji" aria-hidden="true"' + (d.img ? ' style="display:none"' : '') + '>' + esc(d.em) + '</span>';
  if(!d.img) return emo;
  var src = /^(data:|https?:|\/)/.test(d.img) ? d.img : (IMG_BASE + d.img);
  return '<img class="pic" src="' + esc(src) + '" alt="" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'block\'">' + emo;
}

function speak(text){
  try {
    var s = window.speechSynthesis;
    if(!s) return;
    s.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.8;
    s.speak(u);
  } catch(e) {}
}

/* 查到單字時：例句卡片下方提供 Yahoo 字典捷徑按鈕 */
function showWord(d){
  q.value = d.w;
  updateClearBtn();
  
  var encodedWord = encodeURIComponent(d.w);
  var yahooUrl = 'https://tw.dictionary.search.yahoo.com/search?p=' + encodedWord;

  stage.innerHTML = 
    '<article class="card">' +
      pic(d) +
      '<div class="wordrow"><h3 class="word">' + esc(d.w) + '</h3>' +
        '<button class="say" id="sayw" aria-label="聽發音">🔊</button></div>' +
      '<div class="meta">' + esc(d.ph) + '<span class="pos">' + esc(d.pos) + '</span></div>' +
      '<div class="zh">' + esc(d.zh) + '</div>' +
      '<div class="ex"><button class="say small" id="saye" aria-label="聽例句">🔊</button>' +
        '<div><p class="en">' + esc(d.ex) + '</p><p class="cn">' + esc(d.exzh) + '</p></div></div>' +
    '</article>' +
    '<div class="ext-dict-card">' +
      '<a class="ext-dict-btn" href="' + yahooUrl + '" target="_blank" rel="noopener noreferrer" onclick="return openExt(event, \'' + yahooUrl + '\')">' +
        '🔍 Yahoo 字典' +
      '</a>' +
    '</div>';

  $('sayw').onclick = function(){ speak(d.w); };
  $('saye').onclick = function(){ speak(d.ex); };
  renderNear(d);
  speak(d.w);
}

function renderNear(d){
  var idx = -1;
  for(var i = 0; i < DB.length; i++){ if(DB[i] === d){ idx = i; break; } }
  if(idx < 0) return;
  var box = $('chips'); box.innerHTML = '';
  var start = Math.max(0, idx - 10);
  var end = Math.min(DB.length, idx + 11);
  for(var j = start; j < end; j++){
    var item = DB[j];
    var b = chip(item);
    if(item === d) b.className += ' now';
    box.appendChild(b);
  }
  $('near').style.display = 'block';
}

function showMsg(emoji, text){
  $('near').style.display = 'none';
  stage.innerHTML = '<div class="card msg"><span class="emoji">' + emoji + '</span><p>' + text + '</p></div>';
}

/* 查無收錄時：跳出放大鏡詢問卡片，提供 Yahoo 字典捷徑按鈕 */
function showNotFound(word){
  $('near').style.display = 'none';
  var encodedWord = encodeURIComponent(word);
  var yahooUrl = 'https://tw.dictionary.search.yahoo.com/search?p=' + encodedWord;

  stage.innerHTML = 
    '<article class="card msg">' +
      '<span class="emoji">🔍</span>' +
      '<h3 style="margin:10px 0 6px; font-size:1.4rem; color:#0F6F6B;">這個字尚未收錄</h3>' +
      '<p style="margin:0 0 14px; opacity:0.85; font-size:1.1rem;">是否連接網路字典查詢「<b>' + esc(word) + '</b>」？</p>' +
      '<div class="ext-dict-box-vertical">' +
        '<a class="ext-dict-btn" href="' + yahooUrl + '" target="_blank" rel="noopener noreferrer" onclick="return openExt(event, \'' + yahooUrl + '\')">' +
          '🔍 Yahoo 字典' +
        '</a>' +
      '</div>' +
    '</article>';
}

function chip(d){
  var b = document.createElement('button');
  b.className = 'chip';
  b.textContent = d.w;
  b.onclick = function(){ showWord(d); };
  return b;
}

/* 精確比對查詢：移除所有自動猜字與模糊跳轉 */
function search(){
  var t = q.value.trim().toLowerCase();
  if(!t){ showMsg('🔍','先輸入一個英文單字吧！'); return; }
  
  var hit = DB.find(function(d){ return d.w === t; });
  if(hit){ 
    showWord(hit); 
    return; 
  }
  
  showNotFound(t);
}

/* 控制唯一清除按鈕的顯示/隱藏 */
function updateClearBtn(){
  if (bclear) {
    bclear.style.display = q.value.trim().length ? 'block' : 'none';
  }
}

q.addEventListener('input', updateClearBtn);
q.addEventListener('keyup', updateClearBtn);
q.addEventListener('change', updateClearBtn);

/* 點擊自訂清除按鈕：清空文字、隱藏按鈕、重設畫面並聚焦輸入框 */
bclear.onclick = function(){
  q.value = '';
  updateClearBtn();
  showMsg('🤖','Hello!我是你的小助手！');
  q.focus();
};

$('go').onclick = search;
q.addEventListener('keydown', function(e){ if(e.keyCode === 13 || e.key === 'Enter') search(); });

$('imp').onclick = function(){
  $('file').click();
};

$('file').addEventListener('change', function(e){
  var f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  var reader = new FileReader();
  reader.onload = function(evt){
    try {
      var text = evt.target.result;
      var rows = parseCSV(text);
      var validRows = [];
      for(var i = 0; i < rows.length; i++){
        var r = rows[i];
        if(r[0] && !/^(單字|word)$/i.test(r[0].trim())){
          validRows.push(r);
        }
      }
      if(!validRows.length){ showMsg('😵','檔案裡沒有找到單字，請確認格式。'); return; }
      imported = validRows.slice(0, 5000);
      try { localStorage.setItem(STORE_KEY, JSON.stringify(imported)); } catch(err){}
      rebuild();
      showMsg('🎉', '匯入完成，共 ' + imported.length + ' 個單字！');
    } catch(err) {
      showMsg('😵','讀取失敗，請確認檔案格式。');
    }
  };
  reader.readAsText(f);
});

$('clear').onclick = function(){
  imported = [];
  try{ localStorage.removeItem(STORE_KEY); }catch(err){}
  rebuild();
  showMsg('🧹','已清除匯入的單字，回到內建單字。');
};

rebuild();
showMsg('🤖','Hello!我是你的小助手！');
</script>
</body>
</html>
